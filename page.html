<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your 5 Column Grid</title>

  <!-- Monospaced font -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "DM Mono", monospace;
      margin: 0;
      padding: 40px;
      background: #fff;
      color: #222;
    }

    h1 {
      text-align: center;
      margin-bottom: 50px;
      font-weight: 500;
    }

    /* 5-column grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* grid item box */
    .item {
      padding: 20px;
      border: 1px solid #ddd;
      text-align: center;
      transition: 0.2s ease;
      cursor: pointer;
      text-decoration: none;
      color: #222;
    }

    .item:hover {
      background: #f5f5f5;
    }

    .icon {
      width: 50px;
      height: 50px;
      margin-bottom: 15px;
      background-color: #ddd;
      display: inline-block;
      border-radius: 6px;
    }

    .item-title {
      font-size: 14px;
      margin-top: 5px;
    }

    /* Responsive (mobile) */
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<h1>Your Title Here</h1>

<div class="grid">
  <!-- Each item links to another page -->
  
  <a href="page1.html" class="item">
    <div class="icon"></div>
    <div class="item-title">Page One</div>
  </a>

  <a href="page2.html" class="item">
    <div class="icon"></div>
    <div class="item-title">Page Two</div>
  </a>

  <a href="page3.html" class="item">
    <div class="icon"></div>
    <div class="item-title">Page Three</div>
  </a>

  <a href="page4.html" class="item">
    <div class="icon"></div>
    <div class="item-title">Page Four</div>
  </a>

  <a href="page5.html" class="item">
    <div class="icon"></div>
    <div class="item-title">Page Five</div>
  </a>
</div>

</body>
</html>
